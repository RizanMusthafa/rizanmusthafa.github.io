<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rizan Mohomed | Portfolio</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // This script redirects all 404s to index.html while preserving the path
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;
      
      // Redirect to home with the path stored in sessionStorage
      sessionStorage.setItem('redirectPath', path + search + hash);
      window.location.replace('/');
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
